name: Deploy to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 24
      - name: Validate discovery output
        run: |
          pnpm validate:seo
          pnpm validate:links
          node scripts/submit-indexnow.mjs manifest indexnow-current.json
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-manifest
          path: indexnow-current.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-manifest
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-state
          key: indexnow-production-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-production-v1-
      - name: Notify IndexNow after successful deployment
        run: |
          mkdir -p indexnow-state
          node scripts/submit-indexnow.mjs submit indexnow-current.json indexnow-state/previous.json
      - uses: actions/cache/save@v4
        with:
          path: indexnow-state
          key: indexnow-production-v1-${{ github.run_id }}-${{ github.run_attempt }}
